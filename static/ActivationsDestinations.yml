paths:
  "/api/v2/collaborations/{collaboration_id}/activation-segments":
    post:
      description: Creates a new activation segment in the given collaboration.
      operationId: CreateActivationSegment
      parameters:
      - description: The ID of the collaboration to create the activation segment
          in.
        in: path
        name: collaboration_id
        required: true
        type: string
      - in: body
        name: body
        required: true
        schema:
          "$ref": "#/definitions/Activation_Segments.CreateActivationSegmentBody"
      responses:
        '200':
          description: A successful response.
          schema:
            "$ref": "#/definitions/Activation_Segments.CreateActivationSegmentResponse"
        '400':
          description: Returned when the request was not valid.
          schema:
            "$ref": "#/definitions/Error"
        '401':
          description: Returned when the user could not be authorized.
          schema:
            "$ref": "#/definitions/Error"
        '403':
          description: Returned when the user does not have the right to create activation
            segments in this collaboration.
          schema:
            "$ref": "#/definitions/Error"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "#/definitions/Error"
        default:
          description: An unexpected error response.
          schema:
            "$ref": "#/definitions/Error"
      summary: 0. Create Activation Segment
      tags:
      - Activation Segments
    get:
      description: Returns a list of activation segments in the given collaboration.
        The output is affected by provided filters.
      operationId: ListActivationSegments
      parameters:
      - description: The ID of the collaboration to get activation segment details
          from.
        in: path
        name: collaboration_id
        required: true
        type: string
      - description: The requested page of records. Default is 1.
        format: int32
        in: query
        name: pagination.page
        required: false
        type: integer
      - description: The number of records to return per page. Maximum is 500. Default
          is 100.
        format: int32
        in: query
        name: pagination.per_page
        required: false
        type: integer
      - description: |-
          OrderBy is a comma seperated value to define sorting.
          e.g 'created_date_time,name DESC'
          The values are seperated by space, '{column} {ASC/DESC}'
          Valid columns: `created_date_time`, `updated_date_time`, `name`
        in: query
        name: order_by
        required: false
        type: string
      - description: Supported filters are `activation_segment_id`, `creator_id`,
          `name`
        in: query
        name: filter
        required: false
        type: string
      responses:
        '200':
          description: A successful response.
          schema:
            "$ref": "#/definitions/Activation_Segments.ListActivationSegmentsResponse"
        '401':
          description: Returned when the user could not be authorized.
          schema:
            "$ref": "#/definitions/Error"
        '403':
          description: Returned when the user does not have the right to list collaboration
            activation segments.
          schema:
            "$ref": "#/definitions/Error"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "#/definitions/Error"
        default:
          description: An unexpected error response.
          schema:
            "$ref": "#/definitions/Error"
      summary: 1. Get Activation Segments
      tags:
      - Activation Segments
  "/api/v2/collaborations/{collaboration_id}/activation-segments/{activation_segment_id}/calculate":
    post:
      description: Recalculates the audience size based on the activation segment
        query and collaboration.
      operationId: CalculateActivationSegment
      parameters:
      - description: The ID of the collaboration the activation segment belongs to.
        in: path
        name: collaboration_id
        required: true
        type: string
      - description: The ID of the activation segment to calculate.
        in: path
        name: activation_segment_id
        required: true
        type: string
      responses:
        '200':
          description: A successful response.
          schema:
            "$ref": "#/definitions/Activation_Segments.CalculateActivationSegmentResponse"
        '400':
          description: Returned when the request was not valid.
          schema:
            "$ref": "#/definitions/Error"
        '401':
          description: Returned when the user could not be authorized.
          schema:
            "$ref": "#/definitions/Error"
        '403':
          description: Returned when the user does not have the right to calculate
            activation segments in this collaboration.
          schema:
            "$ref": "#/definitions/Error"
        '404':
          description: Returned when the collaboration or activation segment could
            not be found.
          schema:
            "$ref": "#/definitions/Error"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "#/definitions/Error"
        default:
          description: An unexpected error response.
          schema:
            "$ref": "#/definitions/Error"
      summary: 2. Refresh Activation Segment
      tags:
      - Activation Segments
  "/api/v2/collaborations/{collaboration_id}/activation-segments/{activation_segment_id}":
    get:
      description: Returns the details for the requested activation segment from a
        given collaboration.
      operationId: GetActivationSegment
      parameters:
      - description: The ID of the collaboration the activation segment belongs to.
        in: path
        name: collaboration_id
        required: true
        type: string
      - description: The ID of the activation segment you want information about.
        in: path
        name: activation_segment_id
        required: true
        type: string
      responses:
        '200':
          description: A successful response.
          schema:
            "$ref": "#/definitions/Activation_Segments.GetActivationSegmentResponse"
        '400':
          description: Returned when the request was not valid.
          schema:
            "$ref": "#/definitions/Error"
        '401':
          description: Returned when the user could not be authorized.
          schema:
            "$ref": "#/definitions/Error"
        '403':
          description: Returned when the user does not have the right to view details
            of an activation segment in this collaboration.
          schema:
            "$ref": "#/definitions/Error"
        '404':
          description: Returned when the collaboration or activation segment could
            not be found.
          schema:
            "$ref": "#/definitions/Error"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "#/definitions/Error"
        default:
          description: An unexpected error response.
          schema:
            "$ref": "#/definitions/Error"
      summary: 3. Get Activation Segment Status
      tags:
      - Activation Segments
  "/api/v2/collaborations/{collaboration_id}/destinations":
    get:
      description: Returns a list of destinations in the given collaboration. The
