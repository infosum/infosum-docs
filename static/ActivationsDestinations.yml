      operationId: GetActivationSegmentDestinationPushSchema
      parameters:
      - description: The ID of the collaboration.
        in: path
        name: collaboration_id
        required: true
        type: string
      - description: The ID of the activation segment ID to export.
        in: path
        name: activation_segment_id
        required: true
        type: string
      - description: The ID of the destination instance to export to.
        in: path
        name: destination_id
        required: true
        type: string
      responses:
        '200':
          description: A successful response.
          schema:
            "$ref": "#/definitions/Activation_Segment_Exports.GetActivationSegmentDestinationPushSchemaResponse"
        '400':
          description: Returned when the request was not valid.
          schema:
            "$ref": "#/definitions/Error"
        '401':
          description: Returned when the user could not be authorized.
          schema:
            "$ref": "#/definitions/Error"
        '403':
          description: Returned when the user does not have the right to view Destinations.
