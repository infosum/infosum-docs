          schema:
            "$ref": "#/definitions/Error"
      summary: 4. List Destinations
      tags:
        - Activation Segments
  "/api/v2/collaborations/{collaboration_id}/activation-segments/{activation_segment_id}/destinations/{destination_id}/push-schema":
